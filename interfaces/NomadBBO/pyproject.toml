[project]
name = "NomadBBO"
version = "1.0b5"
authors = [
  { name = "Christophe Tribes and Edward Hallé-Hannan", email="christophe.tribes@polymtl.ca"},
]
maintainers = [
  { name = "Christophe Tribes", email="christophe.tribes@polymtl.ca"},
]
description = "Python interface to Nomad 4 for mixed variables problems"
readme = { file = "long_description.md", content-type = "text/markdown"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=2.3.2",
  "scipy",
  "pandas>=1.3.0",
  "pymoo>=0.6.0",
  "smt>=2.10.0",
]


[project.urls]
Documentation = "https://nomad-4-user-guide.readthedocs.io/"
Repository = "https://github.com/bbopt/nomad.git"
Issues = "https://github.com/bbopt/nomad/issues"

[build-system]
requires = [
  'setuptools',
  'cython',
  'wheel',
  'numpy'
]

[tool.setuptools]
py-modules = []
